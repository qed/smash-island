name = "smash-island-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"

# One Durable Object per room code. The game already shards on ?room=, and a DO is addressed by
# name, so the room code IS the object id — no registry, no lookup, no state to keep in sync.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed, which is what the free plan allows (the older key-value DO storage is paid-only).
# This relay keeps nothing in storage — every peer's state lives in its socket attachment — so the
# backing store only matters for which plans can run it.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
